<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>3D Battle Room</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; font-family: 'Segoe UI', sans-serif; }
#join-screen {
  position: fixed; inset: 0; background: linear-gradient(135deg, #1a1a2e, #16213e);
  display: flex; align-items: center; justify-content: center; z-index: 100;
}
#join-box {
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px; padding: 40px; text-align: center; min-width: 320px;
  backdrop-filter: blur(10px);
}
#join-box h1 { color: #fff; font-size: 28px; margin-bottom: 8px; }
#join-box p { color: #888; font-size: 13px; margin-bottom: 20px; }
#join-box input {
  width: 100%; padding: 12px 16px; margin: 8px 0; border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05);
  color: #fff; font-size: 14px; outline: none;
}
#join-box input:focus { border-color: #4a9eff; }
#join-box button {
  width: 100%; padding: 14px; margin-top: 16px; border: none; border-radius: 8px;
  background: linear-gradient(135deg, #4a9eff, #2563eb); color: #fff;
  font-size: 16px; font-weight: bold; cursor: pointer;
}
#join-box button:hover { transform: scale(1.02); }
#hud {
  position: fixed; top: 10px; left: 10px; color: #fff; font-size: 13px;
  background: rgba(0,0,0,0.5); padding: 10px 14px; border-radius: 8px;
  display: none; z-index: 50; line-height: 1.8;
}
#crosshair {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
  color: #fff; font-size: 24px; display: none; z-index: 50; pointer-events: none;
  text-shadow: 0 0 4px rgba(0,0,0,0.8);
}
#controls {
  position: fixed; bottom: 10px; left: 10px; color: rgba(255,255,255,0.6);
  font-size: 11px; background: rgba(0,0,0,0.4); padding: 8px 12px;
  border-radius: 6px; display: none; z-index: 50; line-height: 1.6;
}
#player-list {
  position: fixed; top: 10px; right: 10px; color: #fff; font-size: 12px;
  background: rgba(0,0,0,0.5); padding: 10px 14px; border-radius: 8px;
  display: none; z-index: 50;
}
#player-list h3 { font-size: 12px; color: #aaa; margin-bottom: 6px; }
#player-list span { display: block; padding: 2px 0; }
#hp-bar {
  position: fixed; bottom: 10px; right: 10px; color: #fff; font-size: 14px;
  background: rgba(0,0,0,0.5); padding: 10px 14px; border-radius: 8px;
  display: none; z-index: 50;
}
#hp-fill {
  width: 120px; height: 12px; background: #333; border-radius: 6px; overflow: hidden;
  margin-top: 4px;
}
#hp-fill div { height: 100%; background: #ff4444; transition: width 0.2s; }
#gameover {
  position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none;
  align-items: center; justify-content: center; z-index: 200; flex-direction: column;
}
#gameover h1 { color: #ff4444; font-size: 48px; margin-bottom: 20px; }
#gameover button {
  padding: 14px 32px; font-size: 18px; border: none; border-radius: 8px;
  background: #4a9eff; color: #fff; cursor: pointer;
}
</style>
</head>
<body>

<div id="join-screen">
  <div id="join-box">
    <h1>⚔️ 3D Battle Room</h1>
    <p>ルームIDを共有して友達と遊ぼう<br>（ボットも参加します）</p>
    <input id="inp-name" placeholder="あなたの名前" maxlength="12">
    <input id="inp-room" placeholder="ルームID（例: abc123）" maxlength="12">
    <button onclick="joinRoom()">🎮 参戦する</button>
  </div>
</div>

<div id="hud"></div>
<div id="crosshair">+</div>
<div id="controls">
  WASD: 移動 | Space: ジャンプ | 左クリック: ブロック設置<br>
  右クリック: ブロック破壊 | E: 射撃 | C: 視点切替
</div>
<div id="player-list"><h3>👥 プレイヤー</h3><div id="pl-items"></div></div>
<div id="hp-bar">❤️ HP<div id="hp-fill"><div style="width:100%"></div></div></div>
<div id="gameover"><h1>💀 死亡</h1><p style="color:#fff;margin-bottom:20px" id="go-score"></p><button onclick="respawn()">リスポーン</button></div>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
// ===== Firebase 設定（自分の値に置き換え） =====
const firebaseConfig = {
  apiKey: "ここを置き換え",
  authDomain: "プロジェクト.firebaseapp.com",
  databaseURL: "https://プロジェクト.firebaseio.com",
  projectId: "プロジェクト",
  appId: "自分のappId"
};
let db = null;
try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
} catch(e) { console.log("Firebase未設定 - ボットのみ動作"); }

// ===== Three.js =====
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 50, 120);

const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// 光
const sunLight = new THREE.DirectionalLight(0xfff5e0, 1.5);
sunLight.position.set(30, 50, 30);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.near = 1; sunLight.shadow.camera.far = 150;
sunLight.shadow.camera.left = -50; sunLight.shadow.camera.right = 50;
sunLight.shadow.camera.top = 50; sunLight.shadow.camera.bottom = -50;
scene.add(sunLight);
scene.add(new THREE.AmbientLight(0x6688cc, 0.6));

// 地面
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200),
  new THREE.MeshLambertMaterial({ color: 0x4a8a3a })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(200, 50, 0x3a7a2a, 0x3a7a2a);
grid.position.y = 0.01;
scene.add(grid);

// 山
for (let i = 0; i < 20; i++) {
  const h = 5 + Math.random()*15;
  const m = new THREE.Mesh(
    new THREE.ConeGeometry(8+Math.random()*12, h, 6),
    new THREE.MeshLambertMaterial({ color: 0x5a8a5a })
  );
  const a = (i/20)*Math.PI*2;
  m.position.set(Math.cos(a)*80, h/2, Math.sin(a)*80);
  m.castShadow = true;
  scene.add(m);
}

// ===== プレイヤー =====
const player = new THREE.Group();
const pBody = new THREE.Mesh(
  new THREE.CapsuleGeometry(0.3, 0.8, 8, 16),
  new THREE.MeshLambertMaterial({ color: 0x2288ff })
);
pBody.position.y = 0.9; pBody.castShadow = true;
player.add(pBody);
const pHead = new THREE.Mesh(
  new THREE.SphereGeometry(0.25, 16, 16),
  new THREE.MeshLambertMaterial({ color: 0xffcc99 })
);
pHead.position.y = 1.7; pHead.castShadow = true;
player.add(pHead);
scene.add(player);

// ===== 状態 =====
let myName = '', myRoom = '';
let velocityY = 0, onGround = true, firstPerson = false;
let blocks = [], otherPlayers = {}, bullets = [];
let yaw = 0, pitch = 0, isLocked = false;
let hp = 100, kills = 0, alive = true;
let roomRef = null, myRef = null;

const keys = {};
document.addEventListener('keydown', e => keys[e.code] = true);
document.addEventListener('keyup', e => keys[e.code] = false);

renderer.domElement.addEventListener('click', () => {
  if (myRoom && !isLocked && alive) renderer.domElement.requestPointerLock();
});
document.addEventListener('pointerlockchange', () => {
  isLocked = document.pointerLockElement === renderer.domElement;
});
document.addEventListener('mousemove', e => {
  if (!isLocked) return;
  yaw -= e.movementX * 0.002;
  pitch -= e.movementY * 0.002;
  pitch = Math.max(-Math.PI/2+0.1, Math.min(Math.PI/2-0.1, pitch));
});
document.addEventListener('mousedown', e => {
  if (!isLocked || !myRoom || !alive) return;
  if (e.button === 0) placeBlock();
  if (e.button === 2) breakBlock();
});
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => {
  if (e.code === 'KeyE' && isLocked && myRoom && alive) shoot();
  if (e.code === 'KeyC') {
    firstPerson = !firstPerson;
    pBody.visible = !firstPerson;
    pHead.visible = !firstPerson;
  }
});

// ===== ブロック =====
const blockColors = [0xff6644, 0x44aaff, 0x44ff88, 0xffdd44, 0xcc66ff, 0xff88cc];
let colorIdx = 0;

function placeBlock() {
  const ray = new THREE.Raycaster();
  ray.setFromCamera(new THREE.Vector2(0,0), camera);
  const hits = ray.intersectObjects([ground, ...blocks]);
  if (hits.length > 0 && hits[0].distance < 10) {
    const p = hits[0].point, n = hits[0].face.normal;
    const bx = Math.round(p.x + n.x*0.5);
    const by = Math.round(p.y + n.y*0.5) + 0.5;
    const bz = Math.round(p.z + n.z*0.5);
    if (by < 0.5) return;
    const block = new THREE.Mesh(
      new THREE.BoxGeometry(1,1,1),
      new THREE.MeshLambertMaterial({ color: blockColors[colorIdx % blockColors.length] })
    );
    block.position.set(bx, by, bz);
    block.castShadow = true;
    scene.add(block);
    blocks.push(block);
    colorIdx++;
  }
}

function breakBlock() {
  const ray = new THREE.Raycaster();
  ray.setFromCamera(new THREE.Vector2(0,0), camera);
  const hits = ray.intersectObjects(blocks);
  if (hits.length > 0 && hits[0].distance < 10) {
    scene.remove(hits[0].object);
    blocks = blocks.filter(b => b !== hits[0].object);
  }
}

// ===== 射撃 =====
function shoot() {
  const dir = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
  const bullet = new THREE.Mesh(
    new THREE.SphereGeometry(0.12, 8, 8),
    new THREE.MeshBasicMaterial({ color: 0xffff00 })
  );
  bullet.position.copy(camera.position).add(dir.clone().multiplyScalar(1));
  scene.add(bullet);
  bullets.push({ mesh: bullet, vel: dir.multiplyScalar(1.2), life: 80, from: 'player' });
}

// ===== ボット（CPU） =====
const bots = [];
const BOT_NAMES = ['ボット・赤','ボット・緑','ボット・紫','ボット・橙','ボット・水色'];
const BOT_COLORS = [0xff3333, 0x33ff33, 0xaa33ff, 0xff8833, 0x33ffff];

function spawnBot(i) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.3, 0.8, 8, 16),
    new THREE.MeshLambertMaterial({ color: BOT_COLORS[i % BOT_COLORS.length] })
  );
  body.position.y = 0.9; body.castShadow = true;
  g.add(body);
  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.25, 16, 16),
    new THREE.MeshLambertMaterial({ color: 0xffcc99 })
  );
  head.position.y = 1.7;
  g.add(head);
  // 名前表示
  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 64;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(0, 0, 256, 64);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 28px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(BOT_NAMES[i % BOT_NAMES.length], 128, 42);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(canvas), transparent: true
  }));
  sprite.position.y = 2.3;
  sprite.scale.set(1.5, 0.4, 1);
  g.add(sprite);

  const angle = (i / 5) * Math.PI * 2;
  g.position.set(Math.cos(angle) * 10, 0, Math.sin(angle) * 10);
  scene.add(g);

  bots.push({
    mesh: g,
    name: BOT_NAMES[i % BOT_NAMES.length],
    hp: 100,
    targetYaw: Math.random() * Math.PI * 2,
    changeTimer: 0,
    shootTimer: 0,
    speed: 2 + Math.random() * 2
  });
}

function updateBots(dt) {
  bots.forEach(bot => {
    if (bot.hp <= 0) return;

    // 行動判定
    bot.changeTimer -= dt;
    bot.shootTimer -= dt;

    if (bot.changeTimer <= 0) {
      bot.changeTimer = 2 + Math.random() * 3;
      // 70%プレイヤーを追う、30%ランダム移動
      if (Math.random() < 0.7 && alive) {
        const dx = player.position.x - bot.mesh.position.x;
        const dz = player.position.z - bot.mesh.position.z;
        bot.targetYaw = Math.atan2(-dx, -dz);
      } else {
        bot.targetYaw = Math.random() * Math.PI * 2;
      }
    }

    // 移動
    const speed = bot.speed * dt;
    bot.mesh.position.x += Math.sin(bot.targetYaw) * speed;
    bot.mesh.position.z += Math.cos(bot.targetYaw) * speed;
    bot.mesh.rotation.y = bot.targetYaw;

    // 範囲制限（中心から50以内）
    const dist = bot.mesh.position.length();
    if (dist > 50) {
      bot.mesh.position.multiplyScalar(50 / dist);
    }

    // 射撃（プレイヤーが30以内なら）
    if (alive) {
      const toPlayer = new THREE.Vector3().subVectors(player.position, bot.mesh.position);
      const distToPlayer = toPlayer.length();
      if (distToPlayer < 30 && bot.shootTimer <= 0) {
        bot.shootTimer = 1.5 + Math.random() * 1.5;
        const dir = toPlayer.normalize();
        const bullet = new THREE.Mesh(
          new THREE.SphereGeometry(0.12, 8, 8),
          new THREE.MeshBasicMaterial({ color: 0xff4444 })
        );
        bullet.position.copy(bot.mesh.position).add(new THREE.Vector3(0, 1.2, 0));
        scene.add(bullet);
        bullets.push({ mesh: bullet, vel: dir.multiplyScalar(0.9), life: 60, from: bot.name });
      }
    }
  });
}

// ボットを5体生成
for (let i = 0; i < 5; i++) spawnBot(i);

// ===== ルーム参加 =====
function joinRoom() {
  myName = document.getElementById('inp-name').value || 'プレイヤー';
  myRoom = document.getElementById('inp-room').value || 'default';
  document.getElementById('join-screen').style.display = 'none';
  document.getElementById('hud').style.display = 'block';
  document.getElementById('crosshair').style.display = 'block';
  document.getElementById('controls').style.display = 'block';
  document.getElementById('player-list').style.display = 'block';
  document.getElementById('hp-bar').style.display = 'block';

  if (db) {
    roomRef = db.ref('rooms/' + myRoom);
    myRef = roomRef.child(myName);
    setInterval(() => {
      if (!myRef || !alive) return;
      myRef.set({ x: player.position.x, y: player.position.y, z: player.position.z, yaw: yaw, ts: Date.now() });
    }, 80);
    roomRef.on('value', snap => {
      const data = snap.val() || {};
      const items = document.getElementById('pl-items');
      let html = '<span>🔵 ' + myName + '（自分）</span>';
      bots.forEach(b => { if (b.hp > 0) html += '<span>🤖 ' + b.name + '</span>'; });
      Object.keys(data).forEach(name => {
        if (name === myName) return;
        const info = data[name];
        if (!info.x) return;
        html += '<span>🔵 ' + name + '</span>';
        if (!otherPlayers[name]) {
          const g = new THREE.Group();
          const b = new THREE.Mesh(
            new THREE.CapsuleGeometry(0.3, 0.8, 8, 16),
            new THREE.MeshLambertMaterial({ color: Math.floor(Math.random()*0xffffff) })
          );
          b.position.y = 0.9; b.castShadow = true;
          g.add(b);
          const h = new THREE.Mesh(
            new THREE.SphereGeometry(0.25, 16, 16),
            new THREE.MeshLambertMaterial({ color: 0xffcc99 })
          );
          h.position.y = 1.7;
          g.add(h);
          scene.add(g);
          otherPlayers[name] = g;
        }
        otherPlayers[name].position.set(info.x, info.y, info.z);
        if (info.yaw) otherPlayers[name].rotation.y = info.yaw;
      });
      Object.keys(otherPlayers).forEach(name => {
        if (!data[name]) { scene.remove(otherPlayers[name]); delete otherPlayers[name]; }
      });
      items.innerHTML = html;
    });
    window.addEventListener('beforeunload', () => { if (myRef) myRef.set(null); });
  }
}

// ===== 被弾判定 =====
function checkBullets() {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    // プレイヤー被弾
    if (b.from !== 'player' && alive) {
      const dist = b.mesh.position.distanceTo(new THREE.Vector3(player.position.x, player.position.y + 1, player.position.z));
      if (dist < 0.8) {
        hp -= 10;
        document.getElementById('hp-fill').firstElementChild.style.width = hp + '%';
        if (hp <= 0) die();
        scene.remove(b.mesh);
        bullets.splice(i, 1);
        continue;
      }
    }
    // ボット被弾
    if (b.from === 'player') {
      let hit = false;
      bots.forEach(bot => {
        if (bot.hp <= 0) return;
        const dist = b.mesh.position.distanceTo(new THREE.Vector3(bot.mesh.position.x, bot.mesh.position.y + 1, bot.mesh.position.z));
        if (dist < 0.8) {
          bot.hp -= 15;
          hit = true;
          if (bot.hp <= 0) {
            kills++;
            scene.remove(bot.mesh);
            // 2秒後にリスポーン
            setTimeout(() => {
              bot.hp = 100;
              const angle = Math.random() * Math.PI * 2;
              bot.mesh.position.set(Math.cos(angle)*15, 0, Math.sin(angle)*15);
              scene.add(bot.mesh);
            }, 2000);
          }
        }
      });
      if (hit) { scene.remove(b.mesh); bullets.splice(i, 1); continue; }
    }
    b.life--;
    if (b.life <= 0) { scene.remove(b.mesh); bullets.splice(i, 1); }
  }
}

function die() {
  alive = false;
  document.exitPointerLock();
  document.getElementById('gameover').style.display = 'flex';
  document.getElementById('go-score').textContent = 'キル数: ' + kills;
}

function respawn() {
  hp = 100;
  alive = true;
  player.position.set(0, 0, 0);
  document.getElementById('hp-fill').firstElementChild.style.width = '100%';
  document.getElementById('gameover').style.display = 'none';
}

// ===== ゲームループ =====
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  if (myRoom && alive) {
    const speed = 8 * dt;
    const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
    const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));

    if (keys['KeyW'] || keys['ArrowUp']) player.position.add(forward.clone().multiplyScalar(speed));
    if (keys['KeyS'] || keys['ArrowDown']) player.position.add(forward.clone().multiplyScalar(-speed));
    if (keys['KeyA'] || keys['ArrowLeft']) player.position.add(right.clone().multiplyScalar(-speed));
    if (keys['KeyD'] || keys['ArrowRight']) player.position.add(right.clone().multiplyScalar(speed));

    if (keys['Space'] && onGround) { velocityY = 8; onGround = false; }
    velocityY -= 20 * dt;
    player.position.y += velocityY * dt;
    if (player.position.y <= 0) { player.position.y = 0; velocityY = 0; onGround = true; }

    player.rotation.y = yaw;

    if (firstPerson) {
      camera.position.set(player.position.x, player.position.y + 1.7, player.position.z);
    } else {
      camera.position.set(
        player.position.x + Math.sin(yaw)*5,
        player.position.y + 3,
        player.position.z + Math.cos(yaw)*5
      );
    }
    camera.rotation.order = 'YXZ';
    camera.rotation.y = yaw;
    camera.rotation.x = pitch;

    document.getElementById('hud').innerHTML =
      '📍 X:' + Math.round(player.position.x) + ' Z:' + Math.round(player.position.z) +
      '<br>🎮 ' + myRoom + ' | 👤 ' + myName + ' | ⚔️ キル: ' + kills;
  }

  updateBots(dt);
  checkBullets();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
